[pytest]
addopts = --basetemp=.pytest-tmp
cache_dir = .pytest-cache-local
markers =
    current: contracts exercised by the current public AOMatch product
    legacy: historical migration or superseded-version regression coverage
    integration: tests spanning protected or external data boundaries
    environment: tests whose result can depend on environment-owned resources
    ai: AI validation, deterministic mock, or fallback behavior
    roster: canonical or resolved roster integrity coverage
